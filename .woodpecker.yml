variables:
  - &install_pnpm "npm i -f -g corepack@latest && corepack enable pnpm"

steps:
  install:
    image: node:alpine
    commands:
      - *install_pnpm
      - pnpm i
    when:
      - event: pull_request

  prettier_check:
    image: jauderho/prettier:3.9.6-alpine
    commands:
      - prettier -c .
    when:
      - event: pull_request

  tsoa:
    image: node:alpine
    commands:
      - *install_pnpm
      - pnpm tsoa
    when:
      - event: pull_request

  lint:
    image: node:alpine
    commands:
      - *install_pnpm
      - pnpm lint
    when:
      - event: pull_request

  npm_publish:
    image: node:alpine
    environment:
      NPM_TOKEN:
        from_secret: npm_token
    commands:
      - *install_pnpm
      - pnpm i
      - echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> .npmrc
      - echo "email = tyhou13@gmx.com" >> ~/.npmrc
      - npm publish --tag latest
    when:
      - event: tag

  notify_success:
    image: codeberg.org/l-x/woodpecker-ntfy
    when:
      - event: pull_request
        status: [success]
    settings:
      url: https://ntfy.sh/lemmy_drone_ci
      title: "✔️ ${CI_REPO_NAME}/${CI_COMMIT_SOURCE_BRANCH}"
      message: ${CI_PIPELINE_URL}
      click: ${CI_PIPELINE_URL}

  notify_failure:
    image: codeberg.org/l-x/woodpecker-ntfy
    when:
      - event: pull_request
        status: [failure]
    settings:
      url: https://ntfy.sh/lemmy_drone_ci
      title: "❌ ${CI_REPO_NAME}/${CI_COMMIT_SOURCE_BRANCH}"
      message: ${CI_PIPELINE_URL}
      click: ${CI_PIPELINE_URL}

  notify_on_tag_deploy:
    image: codeberg.org/l-x/woodpecker-ntfy
    when:
      - event: [tag]
    settings:
      url: https://ntfy.sh/lemmy_drone_ci
      title: "${CI_REPO_NAME}:${CI_COMMIT_TAG} deployed"
      message: ${CI_PIPELINE_URL}
      click: ${CI_PIPELINE_URL}
